<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 - 道路巡检系统</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<style>
body { min-height: 100vh; background: #f5f6fa; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; display: grid; place-items: center; }
.auth-panel { width: min(420px, calc(100vw - 32px)); background: #fff; border-radius: 10px; box-shadow: 0 12px 28px rgba(0,0,0,.12); padding: 30px; }
.brand { color: #1a237e; font-weight: 700; font-size: 22px; text-align: center; margin-bottom: 22px; }
</style>
</head>
<body>
<main class="auth-panel">
    <div class="brand"><i class="bi bi-person-plus"></i> 创建账号</div>
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
    <div class="alert alert-{{ category }} py-2">{{ msg }}</div>
    {% endfor %}
    {% endwith %}
    <form method="post">
        <div class="mb-3">
            <label class="form-label">用户名</label>
            <input class="form-control" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label">密码</label>
            <input class="form-control" name="password" type="password" autocomplete="new-password" required>
        </div>
        <div class="mb-3">
            <label class="form-label">确认密码</label>
            <input class="form-control" name="confirm_password" type="password" autocomplete="new-password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">注册</button>
    </form>
    <div class="text-center mt-3 small">
        已有账号？<a href="/login">返回登录</a>
    </div>
</main>
</body>
</html>
